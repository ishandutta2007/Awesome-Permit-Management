<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 48px; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #38bdf8; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    .badge-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
  </style>

  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <circle cx="150" cy="100" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;170;140" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="160" fill="#7c3aed" opacity="0.22" filter="url(#glow)">
    <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite" />
    <animate attributeName="r" values="160;190;160" dur="9s" repeatCount="indefinite" />
  </circle>

  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="400" /><line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" /><line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" /><line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" /><line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" /><line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" /><line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <g transform="translate(1020, 110)">
    <circle r="45" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;55;20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="25" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="10;35;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M-10,-4 L0,-12 L10,-4 L10,10 L-10,10 Z M-5,10 L-5,2 M5,10 L5,2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <g transform="translate(80, 55)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="tag-text">GOVTECH &amp; CIVIC TECH</text>
  </g>

  <text x="80" y="145" class="title-text">
    Awesome <tspan fill="url(#accentGrad)">Permit Management</tspan> 🏛️
  </text>

  <text x="80" y="185" class="subtitle-text">
    Curated Hub for Municipal SaaS Platforms, Open-Source Civic Engines &amp; Plan Review Tools
  </text>

  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" class="badge-pill">🏗️ Building Permits</text>
    <rect x="180" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="200" y="24" class="badge-pill">📋 Plan Reviews</text>
    <rect x="355" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="375" y="24" class="badge-pill">🔍 Code Inspections</text>
    <rect x="540" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="560" y="24" class="badge-pill">🌐 Open Standards</text>
  </g>

  <g transform="translate(80, 290)" filter="url(#cardShadow)">
    <rect width="1040" height="75" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(45, 18)">
      <text x="0" y="22" class="stat-val">14+ SaaS</text>
      <text x="0" y="42" class="stat-lbl">ENTERPRISE PLATFORMS</text>
    </g>
    <line x1="220" y1="15" x2="220" y2="60" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(265, 18)">
      <text x="0" y="22" class="stat-val" fill="#10b981">12+ OSS</text>
      <text x="0" y="42" class="stat-lbl">OPEN REPOSITORIES</text>
    </g>
    <line x1="440" y1="15" x2="440" y2="60" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(485, 18)">
      <text x="0" y="22" class="stat-val" fill="#a855f7">100% Verified</text>
      <text x="0" y="42" class="stat-lbl">PRICING &amp; FREE TIERS</text>
    </g>
    <line x1="680" y1="15" x2="680" y2="60" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(725, 18)">
      <text x="0" y="22" class="stat-val" fill="#f59e0b">~.4B</text>
      <text x="0" y="42" class="stat-lbl">GOVTECH MARKET SIZE</text>
    </g>
    <line x1="890" y1="15" x2="890" y2="60" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(930, 18)">
      <text x="0" y="22" class="stat-val" fill="#38bdf8">2026</text>
      <text x="0" y="42" class="stat-lbl">CURATED &amp; ACTIVE</text>
    </g>
  </g>
</svg>